# name: Artefact detail
query ArtefactDetail($id: UUID!) {
  language
  artefact(id: $id) {
    id
    inventoryNumber
    title
    maker
    creationDate { display earliestYear latestYear precision }
    medium
    dimensions
    width { value inMetres unit { id name abbreviation factor } }
    height { value inMetres unit { id name abbreviation factor } }
    length { value inMetres unit { id name abbreviation factor } }
    diameter { value inMetres unit { id name abbreviation factor } }
    description
    descriptionLanguage
    catalogueEntry
    catalogueEntryLanguage
    acquisition {
      method
      date
      lot
      note
      price { amount currency }
      source { id name kind }
    }
    provenance {
      region { id name }
      period { display earliestYear latestYear precision }
      note
    }
    primaryImage {
      caption
      urls { thumb web print }
    }
    images {
      mediaAssetId
      originalFileName
      format
      sizeBytes
      uploadedAt
      caption
      isPrimary
      urls { thumb web print }
    }
    objectType { id name }
    collectionGroup { id name }
    placeOfProduction { text region { id name } }
    dynasty { id name }
    exhibitions
    holder { id name kind }
    storageLocation { id name }
    valuation { amount currency }
  }
}
