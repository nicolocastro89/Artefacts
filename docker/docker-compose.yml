# Local development stack: PostgreSQL, SeaweedFS (S3-compatible, persistent) and imgproxy.
# The API and frontend run on the host. Usage (from repo root):
#   docker compose -f docker/docker-compose.yml up -d
name: artefacts

services:
  postgres:
    image: postgres:17.12
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artefacts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-artefacts}
      POSTGRES_DB: ${POSTGRES_DB:-artefacts}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  s3:
    image: chrislusf/seaweedfs:4.54
    command: >
      server -dir=/data -ip=s3 -ip.bind=0.0.0.0
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - s3-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  s3-init:
    image: amazon/aws-cli:2.41.1
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-artefacts-dev}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-artefacts-dev-secret}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://s3:8333
      BUCKET: ${S3_BUCKET:-artefacts-media}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - aws s3api head-bucket --bucket "$$BUCKET" 2>/dev/null || aws s3api create-bucket --bucket "$$BUCKET"
    restart: "no"

  imgproxy:
    image: darthsim/imgproxy:v4.0.24
    depends_on:
      s3:
        condition: service_healthy
    environment:
      IMGPROXY_BIND: ":8080"
      IMGPROXY_KEY: ${IMGPROXY_KEY:-a86d03b9cbd7d9ada5a11a4966fbc20cdad396f26455f70b17a79a366211b701}
      IMGPROXY_SALT: ${IMGPROXY_SALT:-00899ee009d3ca5365ba6b27f2ed185720037e63ea019ff17a56a786901ac3bb}
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: http://s3:8333
      IMGPROXY_S3_ENDPOINT_USE_PATH_STYLE: "true"
      IMGPROXY_S3_REGION: us-east-1
      IMGPROXY_S3_ALLOWED_BUCKETS: ${S3_BUCKET:-artefacts-media}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-artefacts-dev}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-artefacts-dev-secret}
      IMGPROXY_ONLY_PRESETS: "true"
      IMGPROXY_PRESETS: "thumb=resizing_type:fit/width:400/height:400/quality:80,web=resizing_type:fit/width:1600/height:1600/quality:85,print=resizing_type:fit/width:3000/height:3000/quality:92/format:jpg"
      IMGPROXY_AUTO_WEBP: "true"
      IMGPROXY_AUTO_ROTATE: "true"
      IMGPROXY_STRIP_COLOR_PROFILE: "true"
      IMGPROXY_MAX_SRC_RESOLUTION: "250"
      IMGPROXY_MAX_SRC_FILE_SIZE: "262144000"
      IMGPROXY_ALLOW_ORIGIN: "*"
    ports:
      - "127.0.0.1:${IMGPROXY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  s3-data:
